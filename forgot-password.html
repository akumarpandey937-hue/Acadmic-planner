<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – AcademicOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="animated-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

  <div class="w-full max-w-md relative z-10">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 text-2xl font-bold mb-2">
        <span>🎓</span><span class="gradient-text">AcademicOS</span>
      </a>
      <p class="text-[var(--text-secondary)]" id="pageSubtitle">Enter your email to reset password.</p>
    </div>

    <div id="forgotSection" class="glass p-8 rounded-2xl">
      <form id="forgotForm" class="space-y-5">
        <div>
          <label class="text-sm font-medium text-[var(--text-secondary)] mb-1 block">Email</label>
          <input type="email" name="email" class="input-field" placeholder="you@college.edu" required>
        </div>
        <button type="submit" class="btn btn-primary w-full py-3">Send Reset Link</button>
      </form>
    </div>

    <div id="resetSection" class="glass p-8 rounded-2xl hidden">
      <form id="resetForm" class="space-y-5">
        <div>
          <label class="text-sm font-medium text-[var(--text-secondary)] mb-1 block">New Password</label>
          <input type="password" name="password" class="input-field" placeholder="Min 6 characters" minlength="6" required>
        </div>
        <div>
          <label class="text-sm font-medium text-[var(--text-secondary)] mb-1 block">Confirm Password</label>
          <input type="password" name="confirmPassword" class="input-field" placeholder="Confirm password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary w-full py-3">Reset Password</button>
      </form>
    </div>

    <p class="text-center mt-6 text-sm">
      <a href="login.html" class="text-[var(--text-secondary)] hover:underline">← Back to Login</a>
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (token) {
      document.getElementById('forgotSection').classList.add('hidden');
      document.getElementById('resetSection').classList.remove('hidden');
      document.getElementById('pageSubtitle').textContent = 'Set your new password.';
    }

    document.getElementById('forgotForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = new FormData(e.target).get('email');
      try {
        await api.post('/auth/forgot-password', { email });
        Utils.toast('If email exists, reset link has been sent.', 'success');
      } catch (err) {
        Utils.toast(err.message, 'error');
      }
    });

    document.getElementById('resetForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      if (fd.get('password') !== fd.get('confirmPassword')) {
        return Utils.toast('Passwords do not match', 'error');
      }
      try {
        await api.put(`/auth/reset-password/${token}`, { password: fd.get('password') });
        Utils.toast('Password reset successful!', 'success');
        setTimeout(() => window.location.href = 'login.html', 1000);
      } catch (err) {
        Utils.toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
